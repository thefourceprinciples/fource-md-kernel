name: CUC Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fource-md-kernel
        run: pip install -e .
      - name: Run Coupled Gearbox Audit
        run: python examples/helical_gearbox_audit.py
      - name: Run Unit & Invalidation Tests
        run: python -m unittest discover -s tests
