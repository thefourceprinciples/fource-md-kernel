name: CUC Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-dag:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fource-md-kernel
        run: pip install -e .
      - name: Run Refactored Fource Algebra & 18-Chapter Test Suite
        run: python -m unittest discover -s tests -v
      - name: Run Kuramoto Phase-Lock Layer Simulation
        run: python examples/kuramoto_net.py
      - name: Run Multi-Basin Kuramoto Branching Simulation
        run: python examples/kuramoto_branch_net.py
