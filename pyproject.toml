[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fource-md-kernel"
version = "0.1.0"
description = "Deterministic Python 3 verification DAG and Coherence-Under-Constraint (CUC) kernel for Modern Machine Design (CIF-MD-000)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "The Fource Principles" }
]
keywords = [
    "machine-design",
    "mechanical-engineering",
    "coherence-under-constraint",
    "verification-dag",
    "fatigue-analysis",
    "tribology"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fource_md*"]
